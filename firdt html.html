<!DOCTYPE html>

<body class="min-h-screen flex flex-col bg-gray-50 text-gray-800">

    <!-- Header Section -->

        <div class="container mx-auto flex flex-col md:flex-row items-center justify-between">
            <!-- Logo / Site Title -->
            <a href="#" class="text-3xl font-extrabold mb-4 md:mb-0 transform hover:scale-105 transition-transform duration-300">
                Elevate Labs
            </a>

            <!-- Navigation Links -->
            
                <ul class="flex flex-row md:flex-row space-p-2 md:space-y-0 md:space-x-8 text-lg">
                    <li>
                        <a href="#" class="block p-2 md:p-0 hover:text-blue-200 transition-colors duration-200 rounded-md">Home</a>
                    </li>
                    <li>

  <!-- Hero Section -->

            <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-4 px-8 rounded-full shadow-lg transform hover:scale-105 transition-all duration-300 ease-in-out focus:outline-none focus:ring-4 focus:ring-blue-300">
